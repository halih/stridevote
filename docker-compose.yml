# Local stack. For day-to-day dev you usually only need the db:
#   docker compose up -d db
#   npm run prisma:migrate && npm run db:seed && npm run dev
#
# To run the whole app in a container (mirrors production):
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      POSTGRES_USER: stridevote
      POSTGRES_PASSWORD: stridevote
      POSTGRES_DB: stridevote
    ports:
      - "5432:5432"
    volumes:
      - stridevote_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stridevote"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stridevote:stridevote@db:5432/stridevote?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET — generate with npx auth secret}
      AUTH_URL: http://localhost:3000
      AUTH_CHANNELS: ${AUTH_CHANNELS:-email}
    ports:
      - "3000:3000"

volumes:
  stridevote_db:
